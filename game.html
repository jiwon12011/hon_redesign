  <script>
    (() => {
      const tabs = [...document.querySelectorAll('.sub-nav-tab')];
      if (!tabs.length) return;
      const panels = tabs.map(t => document.getElementById(t.getAttribute('href').slice(1)));
      document.querySelectorAll('.sub-divider').forEach(hr => hr.classList.add('sub-tab-hidden'));
      const activeIdx = tabs.findIndex(t => t.classList.contains('active'));
      panels.forEach((p, i) => { if (p && i !== activeIdx) p.classList.add('sub-tab-hidden'); });
      tabs.forEach((tab, i) => {
        tab.addEventListener('click', e => {
          e.preventDefault();
          if (tab.classList.contains('active')) return;
          tabs.forEach(t => t.classList.remove('active'));
          tab.classList.add('active');
          panels.forEach((p, j) => {
            if (!p) return;
            if (j === i) { p.classList.remove('sub-tab-hidden'); void p.offsetWidth; p.classList.add('sub-tab-in'); }
            else p.classList.add('sub-tab-hidden');
          });
        });
      });
    })();
    (() => {
      const toggle = document.querySelector('.menu-toggle');
      const drawer = document.querySelector('.mobile-drawer');
      if (!toggle || !drawer) return;
      const open  = () => { toggle.setAttribute('aria-expanded','true');  drawer.classList.add('is-open');    drawer.setAttribute('aria-hidden','false'); };
      const close = () => { toggle.setAttribute('aria-expanded','false'); drawer.classList.remove('is-open'); drawer.setAttribute('aria-hidden','true'); };
      toggle.addEventListener('click', () => toggle.getAttribute('aria-expanded') === 'true' ? close() : open());
      drawer.querySelectorAll('a').forEach(a => a.addEventListener('click', close));
      document.addEventListener('click', e => { if (!drawer.contains(e.target) && !toggle.contains(e.target)) close(); });
    })();
  </script>
